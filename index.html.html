<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">

<title>Bewertung Praxis</title>
<style>
:root{--bg:#F4F0E8;--hi:#FFFFFF;--lo:#D8D0C1;--tx:#1C2A4A;--tx2:#3A4E7A;--mut:#6E7894;--ac:#22365F}

:root[data-theme="dark"]{--bg:#1B2233;--hi:#252E44;--lo:#121827;--tx:#E6E9F2;--tx2:#B9C4DE;--mut:#8B95AE;--ac:#9DB4E8}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0 auto;max-width:720px;padding:18px 16px 0;padding-top:calc(18px + env(safe-area-inset-top,0px));background:var(--bg);color:var(--tx);
font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:6px 4px 12px;color:var(--tx);display:flex;align-items:center;gap:8px}
h1 span{flex:1}
.theme{border:0;background:transparent;color:var(--tx2);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:10px}
input,select{width:100%;padding:13px 16px;font:inherit;font-size:16px;color:var(--tx);border:0;outline:0;-webkit-appearance:none;appearance:none;
background:var(--bg);border-radius:14px;box-shadow:inset 4px 4px 9px var(--lo),inset -4px -4px 9px var(--hi)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--tx2) 50%),linear-gradient(135deg,var(--tx2) 50%,transparent 50%);
background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input::placeholder{color:var(--mut)}
.card{border-radius:18px;padding:16px 16px 14px;margin:14px 0;background:var(--bg);box-shadow:6px 6px 14px var(--lo),-6px -6px 14px var(--hi)}
.code{font-weight:700;color:var(--ac);font-size:17px}
.ks{color:var(--tx2);font-size:14px}
.txt{margin:6px 0 4px;color:var(--tx)}
.mut{color:var(--mut);font-size:13.5px}
.sub{margin-top:14px;padding:12px;border-radius:12px;box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi)}
.sub b{color:var(--tx2);font-weight:600;font-size:14px}
.chip{display:inline-block;border:1px solid var(--tx2);color:var(--tx2);border-radius:8px;padding:0 8px;margin:2px 4px 0 0;font-size:12px}
.btn{padding:9px 14px;border:1.5px solid var(--ac);background:transparent;color:var(--ac);border-radius:10px;font:inherit;font-size:14.5px;margin-top:12px;cursor:pointer}
.btn.fill{background:var(--ac);color:var(--bg)}
.btn:disabled{opacity:.35;cursor:default}
.bar{position:sticky;bottom:0;background:var(--bg);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:2}
.bar .btn{flex:1;margin:0;padding:13px}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:8px;background:var(--ac);color:var(--bg);margin-right:6px;vertical-align:2px}
.prog{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 4px 4px}
.prog span{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--mut);

.prog span.done{cursor:pointer;color:var(--ac);font-weight:700}
.prog span.on{background:var(--ac);color:var(--bg);box-shadow:none;font-weight:700}
.prog .mut{width:100%;margin-top:4px}
.q{font-size:18px;font-weight:600;margin:14px 4px 4px;color:var(--tx)}
.opt{display:block;width:100%;text-align:left;padding:15px 16px;margin:12px 0;border:0;border-radius:16px;background:var(--bg);color:var(--tx);font:inherit;cursor:pointer;

.opt b{display:block;font-weight:600}
.opt.on{background:var(--ac);color:var(--bg)}
.opt.on .mut{color:var(--bg);opacity:.85}
.opt .ck{float:right;font-size:18px;margin-left:8px}
.st{padding:12px 0 6px;border-top:1px solid var(--lo)}.st:first-of-type{border-top:0}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

.seg button.on{background:var(--ac);border-color:var(--ac);color:var(--bg)}
.seg button.nb.on{background:var(--mut);border-color:var(--mut)}
.nrow{display:flex;gap:12px;margin:8px 0;align-items:flex-end}.nrow>div{flex:1;min-width:0}
.big{font-size:24px;font-weight:700;color:var(--ac);line-height:1.2}
.big small{font-size:13px;font-weight:400;color:var(--tx2)}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin:8px 4px}
.jb{padding:4px 9px;border:1.5px solid var(--lo);border-radius:8px;background:transparent;color:var(--mut);font:inherit;font-size:13px;cursor:pointer}
.jb.ok{border-color:var(--ac);color:var(--ac)}.jb.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.res{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--lo)}
.res .t{flex:1;min-width:0;font-size:14px}
.res select{width:auto;min-width:0;padding:8px 30px 8px 10px;font-size:14px}
.res .a{min-width:70px;text-align:center;font-size:13px;color:var(--tx2)}
.res .a b{display:block;font-size:20px;color:var(--ac)}
.lbl{display:block;margin:12px 4px 6px;color:var(--tx2);font-size:14px}
.ph{border:1.5px dashed var(--mut);box-shadow:none}
.warn{color:#9a5b00}
.info{margin:10px 4px;font-size:13.5px;color:var(--mut)}
textarea{width:100%;min-height:76px;padding:12px 14px;font:inherit;font-size:15px;color:var(--tx);border:0;outline:0;resize:vertical;margin-top:8px;
background:var(--bg);border-radius:14px;box-shadow:inset 4px 4px 9px var(--lo),inset -4px -4px 9px var(--hi)}
textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
details.fhd{margin-top:10px}
details.fhd>summary{cursor:pointer;color:var(--ac);font-weight:600;font-size:14px;padding:6px 0}
.fg{margin-top:10px}
.fgl{font-size:12.5px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.03em;margin:4px 0}
.fgl .rec{color:var(--ac);text-transform:none;letter-spacing:0;font-weight:700}
.bs{display:block;width:100%;text-align:left;margin:6px 0;padding:8px 10px;border:1.5px dashed var(--lo);border-radius:10px;background:transparent;color:var(--tx);font:inherit;font-size:14px;cursor:pointer}
.bs:hover{border-color:var(--ac)}
.bs::before{content:"+ ";color:var(--ac);font-weight:700}
.nsel button{flex:0 0 42px}
.hint{font-size:14px}.hint li{margin:4px 0}
.so{display:flex;gap:8px;font-size:13.5px;padding:6px 0;border-top:1px solid var(--lo)}.so>div{flex:1}
.so .n{color:#9a5b00}
</style></head><body>

[['I.1'],'Digitale/analoge Dokumentation','Dokumentiert Beobachtungen und Pflegemaßnahmen in digitalen/analogen Systemen zeitnah, präzise und rechtssicher.','Die Pflegedokumentation erfolgt phasenweise lückenhaft oder nachbereitet; pflegerelevante Veränderungen sollten prägnanter erfasst werden.'],

[['I.4'],'Krisen- & Notfallsituationen','Erkennt lebensbedrohliche Notfallsituationen umgehend, trifft richtige Interventionsentscheidungen und leitet Erstmaßnahmen ein.','Reagiert in unerwarteten Belastungssituationen noch zögerlich; Notfallabläufe und Meldeketten sollten praktisch rekapituliert werden.'],

[['II.1'],'Personenzentrierte Kommunikation','Gestaltet die Interaktion von Empathie, Wertschätzung und Achtsamkeit geprägt; stimmt Verbales und Nonverbales stimmig ab.','Sollte darauf achten, in Stresssituationen Blickkontakt zu halten und dem Gegenüber ausreichend Zeit für Antworten zu lassen.'],
[['II.1'],'Kommunikationsbarrieren','Erkennt alters-, gesundheits- oder kulturbedingte Hürden frühzeitig und setzt kompensatorische Hilfsmittel oder Leichte Sprache ein.','Greift bei bestehenden Sprach- oder Hörbarrieren noch zu oft auf komplexe Fachsprache zurück; vereinfachte Sprache wird empfohlen.'],
[['II.2'],'Information, Schulung & Beratung','Plant und führt Instruktionen sowie Schulungen für Pflegebedürftige und Angehörige nach didaktischen Grundsätzen erfolgreich durch.','Bei Anleitungen von Pflegebedürftigen wird deren aktueller Wissens- und Vorerfahrungsstand noch nicht ausreichend einbezogen.'],
[['II.3'],'Ethisch reflektiertes Handeln','Achtet die Autonomie der Pflegebedürftigen konsequent und bringt ethische Konflikte (z. B. Dilemmata) im Team zur Sprache.','Tut sich schwer, abweichende Entscheidungen von Patienten zu akzeptieren, wenn diese von den eigenen Vorstellungen abweichen.'],
[['III.1'],'Teamarbeit & Rollenabgrenzung','Fügt sich aktiv in das Pflegeteam ein, grenzt Verantwortungsbereiche ab und fordert kollegiale Beratung eigenständig ein.','Es fällt der/dem Auszubildenden noch schwer, bei hoher Arbeitsverdichtung rechtzeitig Unterstützung im Pflegeteam einzufordern.'],
[['III.1','III.3'],'Konfliktbewältigung','Nimmt Spannungen im Team früh wahr, reflektiert unterschiedliche Perspektiven und klärt Meinungsverschiedenheiten sachlich.','Neigt bei Meinungsverschiedenheiten im Team zu Rückzug; eine direkte, lösungsorientierte Richtigstellung sollte angestrebt werden.'],
[['III.2'],'Ärztliche Anordnungen','Führt ärztlich veranlasste Maßnahmen der Diagnostik und Therapie regelkonform, sicher und unter Einhaltung der Hygiene aus.','Überprüft ärztliche Anordnungen vor der Ausführung noch unzureichend auf Plausibilität, Dosisgrenzen und Vollständigkeit.'],
[['III.3'],'Interprofessionelle Kooperation','Arbeitet konstruktiv mit anderen Berufsgruppen (Ärzte, Therapeuten) zusammen und sichert die Informationskontinuität an Schnittstellen.','Schnittstellenberichte werden noch zu passiv übergeben; wichtige pflegerische Beobachtungen sollten selbstbewusster vertreten werden.'],
[['IV.1'],'Qualitätssicherung & Standards','Richtet das Pflegehandeln konsequent an Expertenstandards, internen Leitlinien und qualitätssichernden Instrumenten aus.','Sicherheits- und Qualitätsstandards sind theoretisch bekannt, werden in der Hektik des Alltags jedoch phasenweise verkürzt.'],
[['IV.2'],'Rechtliche Vorgaben & Datenschutz','Hält Schweigepflicht, Datenschutz (DSGVO) und rechtliche Bestimmungen im Arbeitsalltag ohne Ausnahmen ein.','Der vertrauliche Umgang mit Patientendaten (z. B. Blicke auf Bildschirme oder Akten) muss im Stationsalltag sensibler beachtet werden.'],
[['IV.2'],'Ökonomie & Ökologie','Geht mit sachlichen, materiellen und personellen Ressourcen nachhaltig, ökonomisch und umweltbewusst um.','Der Materialverbrauch (z. B. Einwegartikel, Verbandsstoffe) sollte vorausschauender und ressourcenschonender gehandhabt werden.'],
[['V.1'],'Evidenzbasiertes Pflegehandeln','Hinterfragt Routinen kritisch und begründet das eigene Pflegehandeln mit aktuellen, pflegewissenschaftlichen Forschungsergebnissen.','Stützt das Pflegehandeln noch vorrangig auf persönliche Erfahrungswerte oder Gewohnheiten statt auf nachgewiesene Fachstandards.'],
[['V.2'],'Selbstfürsorge & Belastung','Achtet auf die eigene Gesunderhaltung, nimmt physische/psychische Belastungsgrenzen wahr und nutzt Hilfsangebote rechtzeitig.','Lässt eigene körperliche oder psychische Überlastungsanzeichen außer Acht; rechtzeitiges Aufzeigen von Grenzen ist erforderlich.'],
[['V.2'],'Reflexionsfähigkeit & Feedback','Übernimmt volle Eigenverantwortung für den eigenen Lernprozess, reflektiert das Handeln kritisch und fordert Feedback aktiv ein.','Zeigt eine eher abwartende Lernhaltung; sollte Eigeninitiative beim Einfordern von Anleitungs- und Lerngelegenheiten steigern.']

function calc(k){
 const v=k.s.map((_,i)=>S.ans[k.ks+'-'+i]).filter(x=>x>=1);
 if(!v.length)return null;
 const p=Math.round(v.reduce((a,x)=>a+PCT[x],0)/v.length);
 return {p:p,n:noteOf(p),cnt:v.length};}
const optName=v=>{const o=OPT.find(x=>x[0]===v);return o?o[1]:'–';};

/* Formulierungshilfe: Vorschläge passend zu Unterpunkt (ks) bzw. 'G' (Gesamteinschätzung) und Note */
const bsBtn=(ks,t)=>`<button class="bs" data-act="fh" data-k="${esc(ks)}" data-t="${esc(t)}">${esc(t)}</button>`;
const grp=(label,items,ks,rec)=>items.length?`<div class="fg"><div class="fgl">${esc(label)}${rec?' <span class="rec">· empfohlen</span>':''}</div>${items.map(t=>bsBtn(ks,t)).join('')}</div>`:'';
function fhPanel(ks){
 const G=ks==='G',k=G?null:KS.find(x=>x.ks===ks);
 const base=G?0:eff(k),n=FHN[ks]||base;
 let h=`<div class="mut" style="margin-top:6px">Vorschläge für Note${base&&!G?' (aktuell '+base+')':''}:</div>
 <div class="seg nsel">${[1,2,3,4,5,6].map(i=>`<button class="${n===i?'on':''}" data-act="fhn" data-k="${esc(ks)}" data-v="${i}">${i}</button>`).join('')}</div>`;
 if(!n)h+=`<div class="mut" style="margin-top:6px">Note wählen, um passende Bausteine zu sehen.</div>`;
 if(!G&&n){
  const fk=FK.filter(f=>f[0].includes(ks));
  const pos=n<=3,neg=n>=3;
  if(pos)h+=grp(`Stärken · ${ks}`,fk.map(f=>f[2]),ks,n<=2);
  if(neg)h+=grp(`Entwicklungsbedarf · ${ks}`,fk.map(f=>f[3]),ks,n>=4);
 }
 if(n){const F=FN[n];
  h+=`<div class="fg"><div class="fgl">Note ${n} – ${NOTE[n]}: ${esc(F.g)}</div></div>`;
  h+=grp('Aufgabenerfassung & Handlungsbegründung',F.a,ks);
  h+=grp('Schülerverhalten',F.s,ks);
  F.e.forEach(e=>{h+=grp('Entwicklung: '+e[0],e[1],ks);});
  if(n<=3)FS.filter(f=>G||f[1].includes(ks)).forEach(f=>{h+=grp('Satzmuster: '+f[0],f[2],ks);});
 }
 return h;}
const fhDetails=(id,ks)=>`<details class="fhd" data-open="${esc(id)}" ${OPEN.has(id)?'open':''}><summary>✍️ Formulierungshilfen</summary>${fhPanel(ks)}</details>`;
const txtArea=(ks,ph)=>`<textarea data-f="note" data-k="${esc(ks)}" placeholder="${esc(ph)}">${esc(S.note[ks]||'')}</textarea>`;

/* ===================== ANSICHTEN ===================== */
const STEPS=['Ausbildung','Lehrjahr','Bewertungsart','Kompetenzbereiche','Bewerten','Auswertung'];
const opt=(act,v,on,title,sub)=>`<button class="opt ${on?'on':''}" data-act="${act}" data-v="${esc(v)}"><b>${esc(title)}</b>${sub?`<span class="mut">${esc(sub)}</span>`:''}</button>`;

function v0(){return `<div class="q">Welche Ausbildung?</div>`+
 opt('aus','PFA',S.aus==='PFA','Pflegefachassistenz (PFA)','PflFAssAPrV')+
 opt('aus','Gen',S.aus==='Gen','Generalistik (Pflegefachkraft)','PflAPrV');}

function v1(){if(!S.aus)return v0();
 return `<div class="q">Welches Lehrjahr?</div><div class="info">${esc(ausName())}</div>`+
 LJ[S.aus].map(l=>opt('lj',l[0],S.lj===l[0],l[1],l[2])).join('');}

function itemSelect(){
 let h='<option value="">– bitte auswählen –</option>';
 if(S.art==='ala'){
  if(isPFA()){PFA_E.forEach((e,ei)=>{h+=`<optgroup label="${esc(e)}">`+PFA_A.map((a,ai)=>`<option value="p|${ei}|${ai}" ${S.item==='p|'+ei+'|'+ai?'selected':''}>${esc(a)}</option>`).join('')+'</optgroup>';});}
  else{GEN.forEach((E,ei)=>{if(E.dr!==drOf())return;h+=`<optgroup label="${esc(E.e)}">`+E.t.map((t,ti)=>`<option value="g|${ei}|${ti}" ${S.item==='g|'+ei+'|'+ti?'selected':''}>${esc(t[0]+' · '+short(t[1],80))}</option>`).join('')+'</optgroup>';});}
 }else{
  if(isPFA())PFA_E.forEach((e,ei)=>{h+=`<option value="p|${ei}" ${S.item==='p|'+ei?'selected':''}>${esc(e)}</option>`;});
  else GEN.forEach((E,ei)=>{if(E.dr!==drOf())return;h+=`<option value="g|${ei}" ${S.item==='g|'+ei?'selected':''}>${esc(E.e)}</option>`;});
 }
 h+=`<option value="frei" ${S.item==='frei'?'selected':''}>Andere / eigene Eingabe …</option>`;
 return `<select id="item" aria-label="Auswahl">${h}</select>`;}

function v2(){if(!S.lj)return v1();
 let h=`<div class="q">Was wird bewertet?</div><div class="info">${esc(ausName())} · ${esc(ljName())}</div>`+
 opt('art','pb',S.art==='pb','Praxisbegleitung','Besuch der Lehrkraft in der Praxis')+
 opt('art','ala',S.art==='ala','Arbeits- und Lernaufgabe','Praxisaufgabe aus dem Kompetenzkatalog')+
 opt('art','einsatz',S.art==='einsatz','Bewertung Einsatz','Qualifizierte Leistungseinschätzung am Einsatzende');
 if(S.art==='ala'||S.art==='einsatz'){
  h+=`<label class="lbl" for="item">${S.art==='ala'?'Welche Aufgabe?':'Welcher Einsatz?'}${!isPFA()?' <span class="mut">(passend zum '+(drOf()==='3.'?'3.':'1./2.')+' Drittel)</span>':''}</label>`+itemSelect();
  const i=itemInfo();
  if(S.item==='frei')h+=`<input style="margin-top:10px" data-f="frei" placeholder="${S.art==='ala'?'Aufgabe beschreiben':'Einsatz / Bereich'}" value="${esc(S.frei)}">`;
  else if(i&&i.t)h+=`<div class="card"><span class="mut">${esc(i.e)}</span>${i.ks?`<div class="code">${esc(i.ks)}</div>`:''}<div class="txt">${esc(i.t)}</div></div>`;
 }else if(S.art==='pb'){
  h+=`<label class="lbl">Thema / Pflegesituation (optional)</label><input data-f="frei" placeholder="z. B. Grundpflege Bewohnerin S." value="${esc(S.frei)}">`;}
 return h;}

function v3(){const N=KBN[S.aus]||KBN.Gen;const i=itemInfo();
 return `<div class="q">Welche Kompetenzbereiche werden benotet?</div>`+
 (i&&i.ks?`<div class="info">Vorausgewählt nach der Aufgabe (${esc(i.ks)}). Du kannst weitere wählen.</div>`:'<div class="info">Mehrfachauswahl möglich.</div>')+
 KBS.map(kb=>{const on=S.kbs.includes(kb);const n=KS.filter(k=>kbOf(k.ks)===kb).length;
  return `<button class="opt ${on?'on':''}" data-act="kb" data-v="${kb}"><span class="ck">${on?'☑':'☐'}</span><b>Kompetenzbereich ${kb}</b><span class="mut">${esc(N[kb])} · ${n} Punkte</span></button>`;}).join('')+
 `<div style="display:flex;gap:10px"><button class="btn" data-act="kball">Alle wählen</button><button class="btn" data-act="kbnone">Keine</button></div>`;}

function noteBox(k){const r=calc(k),o=S.over[k.ks]||'';
 return `<div class="sub"><b>Note für ${esc(k.ks)}</b>
 <div class="nrow"><div><div class="mut">Automatisch</div><div class="big">${r?r.n+` <small>${NOTE[r.n]} · ${r.p} %</small>`:'–'}</div></div>
 <div><div class="mut">Eigene Note (optional)</div><select data-f="over" data-k="${esc(k.ks)}"><option value="">– automatisch –</option>${[1,2,3,4,5,6].map(n=>`<option value="${n}" ${String(o)===String(n)?'selected':''}>${n} – ${NOTE[n]}</option>`).join('')}</select></div></div>
 ${txtArea(k.ks,'Notiz / Beurteilungstext (optional) – Bausteine unten antippen, dann frei bearbeiten')}
 ${fhDetails('n-'+k.ks,k.ks)}</div>`;}

function v4(){const L=selKS();if(!L.length){S.step=3;return v3();}
 if(S.sub>=L.length)S.sub=L.length-1;if(S.sub<0)S.sub=0;
 const k=L[S.sub],kb=kbOf(k.ks),N=KBN[S.aus]||KBN.Gen;
 return `<div class="info">Punkt ${S.sub+1} von ${L.length} · Bewertung nach Ausbildungsstand (${esc(ljName())})</div>
 <div class="jump">${L.map((x,i)=>`<button class="jb ${i===S.sub?'on':''} ${calc(x)?'ok':''}" data-act="sub" data-v="${i}">${x.ks}</button>`).join('')}</div>
 <div class="card"><span class="badge">KB ${kb}</span><span class="code">${esc(k.ks)}</span>
 <div class="ks">${esc(ksTitle(k))}</div><div class="mut" style="margin:2px 0 8px">${esc(short(N[kb],110))}</div>
 <div class="mut"><b>Die/Der Auszubildende …</b></div>
 ${k.s.map((s,i)=>{const id=k.ks+'-'+i,a=S.ans[id];
  return `<div class="st"><div class="txt">… ${esc(s[0])}</div>${s[1]?`<span class="chip">${esc(s[1])}</span>`:''}
  <div class="seg">${OPT.map(o=>`<button class="${a===o[0]?'on':''} ${o[0]===0?'nb':''}" data-act="ans" data-id="${id}" data-v="${o[0]}">${o[1]}</button>`).join('')}</div></div>`;}).join('')}
 ${noteBox(k)}</div>`;}

function v5(){const L=selKS();const N=KBN[S.aus]||KBN.Gen;
 const open=L.reduce((a,k)=>a+k.s.filter((_,i)=>S.ans[k.ks+'-'+i]===undefined).length,0);
 let h=`<div class="card"><b>Auswertung</b>
 <div class="mut">${esc(ausName())} · ${esc(ljName())} · ${esc(ART[S.art]||'')}</div>
 ${itemText()?`<div class="txt" style="font-size:14px">${esc(itemText())}</div>`:''}
 <label class="lbl">Schüler-Code / Name</label><input data-f="code" placeholder="z. B. goma" value="${esc(S.code)}">
 <div style="display:flex;gap:10px"><div style="flex:1"><label class="lbl">Datum</label><input type="date" data-f="datum" value="${esc(S.datum)}"></div>
 <div style="flex:1"><label class="lbl">Bewertet von</label><input data-f="pal" placeholder="Kürzel PAL" value="${esc(S.pal)}"></div></div>
 ${open?`<div class="warn mut" style="margin-top:10px">⚠ ${open} Aussage(n) noch nicht beantwortet.</div>`:''}</div>`;
 KBS.filter(kb=>S.kbs.includes(kb)).forEach(kb=>{
  h+=`<div class="card"><span class="badge">KB ${kb}</span><span class="ks">${esc(short(N[kb],120))}</span>`;
  L.filter(k=>kbOf(k.ks)===kb).forEach(k=>{const r=calc(k),o=S.over[k.ks]||'';
   h+=`<div class="res"><div class="t"><b class="code" style="font-size:15px">${esc(k.ks)}</b> ${esc(ksTitle(k))}</div>
   <div class="a">auto<b>${r?r.n:'–'}</b>${r?r.p+' %':''}</div>
   <select data-f="over" data-k="${esc(k.ks)}" aria-label="Eigene Note"><option value="">eigene –</option>${[1,2,3,4,5,6].map(n=>`<option value="${n}" ${String(o)===String(n)?'selected':''}>eigene ${n}</option>`).join('')}</select></div>
   <details class="fhd" data-open="${esc('r-'+k.ks)}" ${OPEN.has('r-'+k.ks)?'open':''}><summary>${S.note[k.ks]?'📝 Beurteilungstext bearbeiten':'+ Beurteilungstext'}</summary>
   ${txtArea(k.ks,'Beurteilungstext zu '+k.ks)}${fhPanel(k.ks)}</details>`;});
  h+='</div>';});
 h+=`<div class="card"><b>Gesamteinschätzung & Empfehlungen</b><div class="mut">Freitext ohne Note. Bausteine nach Notenstufe antippen und anpassen.</div>
 <textarea data-f="gesamt" placeholder="z. B. Stärken, Entwicklungsbedarf, Vereinbarungen …" style="min-height:110px">${esc(S.gesamt)}</textarea>
 ${fhDetails('g','G')}</div>
 <div class="card"><details class="fhd" data-open="hilfe" ${OPEN.has('hilfe')?'open':''}><summary>💬 Gesprächshilfe & Hinweise</summary>
 <div class="fg"><div class="fgl">Abschlussgespräch in 5 Schritten</div><ol class="hint">${SCHRITTE.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>
 ${LEIT.map(l=>`<div class="fg"><div class="fgl">Leitfragen: ${esc(l[0])}</div><ul class="hint">${l.slice(1).map(q=>`<li>${esc(q)}</li>`).join('')}</ul></div>`).join('')}
 <div class="fg"><div class="fgl">Konstruktiv formulieren</div>${SO.map(s=>`<div class="so"><div class="n">✗ ${esc(s[0])}</div><div>✓ ${esc(s[1])}</div></div>`).join('')}</div>
 <div class="fg"><div class="fgl">Beobachtungskürzel</div><ul class="hint">${KUERZEL.map(x=>`<li><b>${esc(x[0])}</b> = ${esc(x[1])}</li>`).join('')}</ul></div>
 </details></div>
 <div class="info">Keine Gesamtnote und kein Mittelwert. Notenskala nach Tabelle A (1: 100–96 %, 2: 95–85 %, 3: 84–70 %, 4: 69–50 %, 5: 49–35 %, 6: 34–0 %).</div>
 <button class="btn" data-act="reset" style="width:100%">Neue Bewertung beginnen</button>`;
 return h;}

/* ===================== STEUERUNG ===================== */
function canNext(){switch(S.step){
 case 0:return !!S.aus;case 1:return !!S.lj;
 case 2:return S.art==='pb'||(!!S.art&&!!S.item&&(S.item!=='frei'||!!S.frei.trim()));
 case 3:return S.kbs.length>0;default:return true;}}
function updBar(){const b=$('next');if(b)b.disabled=!canNext();}
function renderBar(){
 if(S.step===5){$('bar').innerHTML=`<button class="btn" id="back" data-act="back">Zurück</button><button class="btn fill" data-act="md">Export .md</button><button class="btn fill" data-act="csv">Export CSV</button>`;return;}
 const L=selKS(),last=S.step===4&&S.sub>=L.length-1;
 $('bar').innerHTML=`<button class="btn" data-act="back" ${S.step===0?'disabled':''}>Zurück</button><button class="btn fill" id="next" data-act="next">${last?'Zur Auswertung':'Weiter'}</button>`;
 updBar();}
function render(){
 $('prog').innerHTML=STEPS.map((s,i)=>`<span class="${i===S.step?'on':i<S.step?'done':''}" ${i<S.step?`data-act="go" data-v="${i}"`:''} title="${s}">${i+1}</span>`).join('')+`<div class="mut">Schritt ${S.step+1} von 6 · ${STEPS[S.step]}</div>`;
 $('out').innerHTML=[v0,v1,v2,v3,v4,v5][S.step]();
 renderBar();save();}

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
 const a=el.dataset.act,v=el.dataset.v;
 switch(a){
 case 'aus':if(S.aus!==v){S.aus=v;S.lj='';S.item='';S.frei='';S.kbs=[];}S.step=1;break;
 case 'lj':if(S.lj!==v){S.lj=v;S.item='';}S.step=2;break;
 case 'art':if(S.art!==v){S.art=v;S.item='';S.frei='';}break;
 case 'kb':S.kbs=S.kbs.includes(v)?S.kbs.filter(x=>x!==v):KBS.filter(x=>x===v||S.kbs.includes(x));break;
 case 'kball':S.kbs=KBS.slice();break;
 case 'kbnone':S.kbs=[];break;
 case 'ans':{const n=+v;if(S.ans[el.dataset.id]===n)delete S.ans[el.dataset.id];else S.ans[el.dataset.id]=n;break;}
 case 'sub':S.sub=+v;break;
 case 'fhn':{const k=el.dataset.k;FHN[k]=FHN[k]===+v?0:+v;break;}
 case 'fh':{const k=el.dataset.k,t=el.dataset.t||'';
  if(k==='G')S.gesamt=(S.gesamt.trim()?S.gesamt.replace(/\s+$/,'')+'\n':'')+t;
  else{const o=S.note[k]||'';S.note[k]=(o.trim()?o.replace(/\s+$/,'')+' ':'')+t;}
  break;}
 case 'go':S.step=+v;if(S.step===4)S.sub=0;break;
 case 'back':if(S.step===4&&S.sub>0)S.sub--;else if(S.step===5){S.step=4;S.sub=Math.max(0,selKS().length-1);}else if(S.step>0)S.step--;window.scrollTo(0,0);break;
 case 'next':if(!canNext())return;if(S.step===4){if(S.sub<selKS().length-1)S.sub++;else S.step=5;}else{S.step++;if(S.step===4)S.sub=0;}window.scrollTo(0,0);break;
 case 'md':exportMD();return;
 case 'csv':exportCSV();return;
 case 'reset':if(!confirm('Neue Bewertung beginnen? Die aktuelle Eingabe wird gelöscht.'))return;S=NEW();window.scrollTo(0,0);break;
 default:return;}
 render();});
$('out').addEventListener('change',e=>{const t=e.target;
 if(t.id==='item'){S.item=t.value;const i=itemInfo();if(i&&i.ks)S.kbs=[kbOf(i.ks)];render();return;}
 if(t.dataset.f==='over'){if(t.value)S.over[t.dataset.k]=+t.value;else delete S.over[t.dataset.k];render();}});
$('out').addEventListener('input',e=>{const t=e.target,f=t.dataset.f;if(!f)return;
 if(f==='note'){if(t.value)S.note[t.dataset.k]=t.value;else delete S.note[t.dataset.k];}
 else if(f==='frei'||f==='code'||f==='datum'||f==='pal'||f==='gesamt')S[f]=t.value;
 save();updBar();});
$('out').addEventListener('toggle',e=>{const d=e.target;if(!d.dataset||!d.dataset.open)return;if(d.open)OPEN.add(d.dataset.open);else OPEN.delete(d.dataset.open);},true);
$('theme').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
 r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('bw-theme',r.dataset.theme)}catch(e){}};

/* ===================== EXPORT ===================== */
function fname(ext){const c=(S.code||'ohne-code').trim().replace(/[^\wäöüÄÖÜß-]+/g,'_');return `Bewertung_${c}_${S.datum||today()}.${ext}`;}
function download(text,name,type){
 /* Handy/Tablet: Teilen-Menü (Mail, OneDrive, Dateien …), sonst normaler Download */
 try{if(matchMedia('(pointer:coarse)').matches&&navigator.canShare){const f=new File([text],name,{type:'text/plain'});
  if(navigator.canShare({files:[f]})){navigator.share({files:[f],title:name}).catch(()=>{});return;}}}catch(e){}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type+';charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove();}catch(e){}
 try{navigator.clipboard.writeText(text).then(()=>alert('Exportiert und in die Zwischenablage kopiert.'),()=>{});}catch(e){}}
function exportMD(){const L=selKS(),N=KBN[S.aus]||KBN.Gen,c=s=>String(s??'').replace(/\|/g,'/').replace(/\n/g,' ');
 let m=`# Bewertung Praxis\n\n- **Schüler-Code / Name:** ${S.code||'–'}\n- **Datum:** ${S.datum||'–'}\n- **Bewertet von:** ${S.pal||'–'}\n- **Ausbildung:** ${ausName()}\n- **Lehrjahr:** ${ljName()}\n- **Bewertungsart:** ${ART[S.art]||'–'}\n`;
 if(itemText())m+=`- **${S.art==='einsatz'?'Einsatz':S.art==='ala'?'Aufgabe':'Thema'}:** ${itemText()}\n`;
 KBS.filter(kb=>S.kbs.includes(kb)).forEach(kb=>{
  m+=`\n## Kompetenzbereich ${kb}\n_${N[kb]}_\n\n| Punkt | Automatische Note | Eigene Note |\n|---|---|---|\n`;
  const ks=L.filter(k=>kbOf(k.ks)===kb);
  ks.forEach(k=>{const r=calc(k),o=S.over[k.ks];m+=`| ${k.ks} ${c(ksTitle(k))} | ${r?r.n+' ('+NOTE[r.n]+', '+r.p+' %)':'–'} | ${o?o+' ('+NOTE[o]+')':'–'} |\n`;});
  const tx=ks.filter(k=>(S.note[k.ks]||'').trim());
  if(tx.length){m+=`\n**Beurteilung**\n\n`;tx.forEach(k=>{m+=`**${k.ks}:** ${S.note[k.ks].trim().replace(/\n+/g,'  \n')}\n\n`;});}
  m+=`\n**Antworten**\n`;
  ks.forEach(k=>k.s.forEach((s,i)=>{m+=`- ${k.ks}: ${s[0]} → ${optName(S.ans[k.ks+'-'+i])}\n`;}));});
 if(S.gesamt.trim())m+=`\n## Gesamteinschätzung & Empfehlungen\n\n${S.gesamt.trim().replace(/\n+/g,'  \n')}\n`;
 m+=`\n---\nNotenskala nach Tabelle A (1: 100–96 %, 2: 95–85 %, 3: 84–70 %, 4: 69–50 %, 5: 49–35 %, 6: 34–0 %). Keine Gesamtnote.\n`;
 download(m,fname('md'),'text/markdown');}
function exportCSV(){const L=selKS(),q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const rows=[['Schüler-Code','Datum','Bewertet von','Ausbildung','Lehrjahr','Bewertungsart','Aufgabe/Einsatz','KB','Punkt','Titel','Prozent','Auto-Note','Eigene Note','Beurteilungstext','Antworten']];
 L.forEach(k=>{const r=calc(k);rows.push([S.code,S.datum,S.pal,ausName(),ljName(),ART[S.art]||'',itemText(),kbOf(k.ks),k.ks,ksTitle(k),r?r.p:'',r?r.n:'',S.over[k.ks]||'',S.note[k.ks]||'',
  k.s.map((s,i)=>optName(S.ans[k.ks+'-'+i])).join(' | ')]);});
 if(S.gesamt.trim())rows.push([S.code,S.datum,S.pal,ausName(),ljName(),ART[S.art]||'',itemText(),'','Gesamt','Gesamteinschätzung & Empfehlungen','','','',S.gesamt.trim(),'']);
 download('﻿'+rows.map(r=>r.map(q).join(';')).join('\n'),fname('csv'),'text/csv');}

render();
</script></body></html>
